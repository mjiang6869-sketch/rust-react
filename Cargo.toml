[workspace]
resolver = "3"
members = ["crates/domain", "crates/data", "crates/sim", "crates/store", "crates/strategies", "crates/cli", "crates/exchange", "crates/engine", "crates/api", "apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# 内部 crate
domain = { path = "crates/domain" }
data = { path = "crates/data" }
sim = { path = "crates/sim" }
store = { path = "crates/store" }
strategies = { path = "crates/strategies" }
exchange = { path = "crates/exchange" }
engine = { path = "crates/engine" }
api = { path = "crates/api" }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# 领域层（零 I/O）
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
hmac = "0.12"

# 数据层
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
arrow = "54"
parquet = { version = "54", default-features = false, features = ["arrow", "zstd", "snap"] }
duckdb = { version = "1", features = ["bundled"] }
