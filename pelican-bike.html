<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324a;
      --sky: #b9ecff;
      --grass: #8fd17b;
      --road: #28475f;
      --coral: #f07f61;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f6fbff;
    }

    .scene-wrap {
      width: min(1120px, 100vw);
      padding: 24px;
    }

    .title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }

    h1 { margin: 0; font-size: clamp(26px, 4vw, 48px); letter-spacing: .02em; }
    .subtitle { margin: 4px 0 0; color: #54718a; font-size: 14px; }

    .controls { display: flex; gap: 8px; }
    button {
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 9px 15px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); background: #fff8d7; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

    .stage {
      position: relative;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 26px;
      background: var(--sky);
      box-shadow: 0 12px 0 #d7eaf3, 0 18px 36px #39617b22;
    }
    svg { display: block; width: 100%; height: auto; }

    .motion { transform-box: fill-box; transform-origin: center; }
    .bike-group { animation: ride 1.15s ease-in-out infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
    .leg-near { transform-box: fill-box; transform-origin: 50% 10%; animation: pedal 1.15s linear infinite; }
    .leg-far { transform-box: fill-box; transform-origin: 50% 10%; animation: pedal 1.15s linear -.575s infinite; }
    .wing { transform-box: fill-box; transform-origin: 18% 82%; animation: flap 1.15s ease-in-out infinite; }
    .head { animation: headbob 1.15s ease-in-out infinite; }
    .cloud-a { animation: drift 24s linear infinite; }
    .cloud-b { animation: drift 31s linear -11s infinite; }
    .road-dashes { animation: road 1.5s linear infinite; }
    .sun { animation: sunpulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    .paused * { animation-play-state: paused !important; }

    @keyframes ride { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedal { 0% { transform: rotate(0deg); } 50% { transform: rotate(155deg); } 100% { transform: rotate(360deg); } }
    @keyframes flap { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-19deg) translateY(-5px); } }
    @keyframes headbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(1120px); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    @keyframes sunpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    @media (max-width: 620px) {
      .scene-wrap { padding: 14px; }
      .title { align-items: start; flex-direction: column; }
      .controls { width: 100%; }
      button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="scene-wrap">
    <div class="title">
      <div>
        <h1>鹈鹕的风之旅</h1>
        <p class="subtitle">一只长嘴鸟，骑着它的小自行车去看海。</p>
      </div>
      <div class="controls">
        <button id="toggle" type="button">暂停动画</button>
        <button id="restart" type="button">重新开始</button>
      </div>
    </div>

    <section class="stage" aria-label="鹈鹕骑自行车的 SVG 动画">
      <svg viewBox="0 0 1100 650" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">鹈鹕骑自行车穿过海边</title>
        <desc id="svgDesc">一只橙色鹈鹕踩着蓝色自行车沿着海边道路前进，车轮、腿和翅膀都在运动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#a8e8ff"/>
            <stop offset="1" stop-color="#e9fbff"/>
          </linearGradient>
          <linearGradient id="sea" x2="0" y2="1">
            <stop stop-color="#62c8d5"/>
            <stop offset="1" stop-color="#308aaa"/>
          </linearGradient>
          <linearGradient id="road" x2="0" y2="1">
            <stop stop-color="#385d71"/>
            <stop offset="1" stop-color="#203d52"/>
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
          <clipPath id="frameClip"><rect width="1100" height="650" rx="22"/></clipPath>
        </defs>

        <g clip-path="url(#frameClip)">
          <rect width="1100" height="650" fill="url(#sky)"/>
          <g class="sun"><circle cx="876" cy="124" r="62" fill="#ffd166"/><circle cx="876" cy="124" r="82" fill="#ffd166" opacity=".17"/></g>

          <g class="cloud-a" fill="#fff" opacity=".8">
            <path d="M-90 162c20-36 73-37 96-5 19-28 68-24 80 14 25-9 51 8 51 35H-90z"/>
          </g>
          <g class="cloud-b" fill="#fff" opacity=".64">
            <path d="M-120 280c24-44 82-42 101-5 25-36 81-18 87 22 30-9 55 10 55 39H-120z"/>
          </g>

          <path d="M0 390c133-45 204-47 334-12 140 38 243 34 375-4 126-36 247-31 391 25v126H0z" fill="#75c99a"/>
          <path d="M0 431c165-44 265-21 377 10 137 38 242 20 354-13 123-36 243-14 369 23v83H0z" fill="url(#sea)"/>
          <path d="M0 485c121-24 238-6 362 14 138 22 238-5 365-17 125-12 245 14 373 37v37H0z" fill="#98e1da" opacity=".42"/>
          <path d="M0 535h1100v115H0z" fill="url(#road)"/>
          <g class="road-dashes" fill="#ffd166" opacity=".9">
            <path d="M-30 585h100v12H-30zM170 585h100v12H170zM370 585h100v12H370zM570 585h100v12H570zM770 585h100v12H770zM970 585h100v12H970z"/>
          </g>
          <path d="M0 534h1100" stroke="#e6f8e8" stroke-width="8"/>

          <g class="bike-group motion">
            <ellipse cx="561" cy="537" rx="184" ry="20" fill="#102f42" opacity=".22" filter="url(#softShadow)"/>
            <g stroke="#f2fbff" stroke-width="5" fill="none" opacity=".9">
              <circle class="wheel" cx="422" cy="492" r="73"/>
              <circle class="wheel" cx="704" cy="492" r="73"/>
              <path d="M422 492L526 491 585 408 704 492 526 491 483 418 585 408 704 492"/>
              <path d="M483 418h-25M704 492l19-62M701 430h28"/>
            </g>
            <g stroke="#f07f61" stroke-width="10" stroke-linecap="round">
              <path d="M526 491l-42-57M526 491l47 41"/>
              <path d="M478 434l-19-9M573 532l18 3"/>
            </g>
            <circle cx="526" cy="491" r="13" fill="#ffd166" stroke="#18324a" stroke-width="5"/>
            <path d="M422 419c-28-33-51-37-69-20" fill="none" stroke="#f2fbff" stroke-width="8" stroke-linecap="round"/>

            <g class="pelican">
              <path d="M508 396c-14-80 22-139 89-151 72-12 121 39 114 107-7 60-43 88-110 91z" fill="#f7a24b" stroke="#18324a" stroke-width="7"/>
              <path d="M555 365c39-5 74 1 101 19-20 47-71 66-125 42z" fill="#ec8647" stroke="#18324a" stroke-width="7"/>
              <path class="wing" d="M575 315c-43 22-57 64-49 105 43 14 78-15 96-61z" fill="#e97c49" stroke="#18324a" stroke-width="7"/>
              <path d="M583 312c-11-72 22-116 75-119 57-3 84 44 62 93-20 45-71 50-137 26z" fill="#f5a04d" stroke="#18324a" stroke-width="7"/>
              <path class="head" d="M688 244c19-34 52-45 81-25 19 14 19 40 1 56-24 21-54 15-82-1z" fill="#f7a24b" stroke="#18324a" stroke-width="7"/>
              <path d="M758 259l106 31c14 4 14 21 0 26l-110 14c-24 3-42-12-39-31 3-20 19-43 43-40z" fill="#f47e55" stroke="#18324a" stroke-width="7"/>
              <path d="M764 290l93 25-98 7z" fill="#ffb28e"/>
              <circle cx="746" cy="246" r="8" fill="#18324a"/>
              <circle cx="749" cy="243" r="3" fill="#fff"/>
              <path d="M693 221c17-17 39-23 56-13" fill="none" stroke="#d87342" stroke-width="9" stroke-linecap="round"/>
              <path class="leg-far" d="M599 405l-18 77" fill="none" stroke="#f47e55" stroke-width="11" stroke-linecap="round"/>
              <path class="leg-far" d="M581 482l-25 16" fill="none" stroke="#f47e55" stroke-width="8" stroke-linecap="round"/>
              <path class="leg-near" d="M642 406l-8 85" fill="none" stroke="#f47e55" stroke-width="11" stroke-linecap="round"/>
              <path class="leg-near" d="M634 491l29 10" fill="none" stroke="#f47e55" stroke-width="8" stroke-linecap="round"/>
              <path d="M574 279c-18 28-15 45 6 57" fill="none" stroke="#fbd37e" stroke-width="9" stroke-linecap="round"/>
            </g>
          </g>

          <g fill="#fff" opacity=".85">
            <path d="M128 455l34-5 26 5-26 5zM820 460l48-6 30 6-30 6zM270 500l32-4 25 4-25 4z"/>
          </g>
        </g>
      </svg>
    </section>
  </main>

  <script>
    const stage = document.querySelector('.stage');
    const toggle = document.querySelector('#toggle');
    const restart = document.querySelector('#restart');

    toggle.addEventListener('click', () => {
      const paused = stage.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
    });

    restart.addEventListener('click', () => {
      stage.classList.remove('paused');
      toggle.textContent = '暂停动画';
      document.querySelectorAll('.motion, .wheel, .leg-near, .leg-far, .wing, .head, .cloud-a, .cloud-b, .road-dashes, .sun').forEach((node) => {
        node.style.animation = 'none';
        void node.offsetWidth;
        node.style.animation = '';
      });
    });
  </script>
</body>
</html>
